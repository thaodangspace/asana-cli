name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to recover"
        required: true
        type: string
      stage:
        description: "Stages to run; retry stages reuse build_run_id"
        required: true
        default: full
        type: choice
        options:
          - full
          - publish
          - promote
          - verify
      build_run_id:
        description: "Workflow run containing release-build (required for retry stages)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  GORELEASER_VERSION: v2.13.3
  GORELEASER_SHA256: 4b66f2f78f78561330350651ade557b70328664718490f37834749073af21d20
  SYFT_VERSION: v1.31.0
  SYFT_SHA256: aa60fbe2a32453e7dea991c9c5c616ae1fff0c51e910419ae53bc6555bfd2ce2

jobs:
  release-preflight:
    name: release-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
      version: ${{ steps.metadata.outputs.version }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
      commit: ${{ steps.metadata.outputs.commit }}
    steps:
      - name: Checkout tagged commit with complete history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate tag, checkout, and ancestry
        id: metadata
        run: python3 .github/scripts/release-preflight.py "$RELEASE_TAG"

      - name: Set up Go from go.mod
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Go quality and race checks
        run: make ci

      - name: Produce coverage without network access
        run: |
          env ASANA_CONFIG=/dev/null ASANA_ACCESS_TOKEN= ASANA_DEFAULT_WORKSPACE= ASANA_API_BASE= \
            go test -count=1 -covermode=atomic -coverprofile=coverage.out ./...

      - name: Build and smoke test the tagged version
        run: |
          set -euo pipefail
          VERSION="$version" make build
          output="$(./asana-cli --version 2>&1)"
          printf '%s\n' "$output"
          grep -F "$version" <<<"$output"
          ./asana-cli --help >/dev/null
        env:
          version: ${{ steps.metadata.outputs.version }}

      - name: Cross-build all supported release targets
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          set -euo pipefail
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            GOOS="${target%/*}" GOARCH="${target#*/}" CGO_ENABLED=0 \
              go build -trimpath -ldflags "-s -w -X github.com/thaodangspace/asana-cli/cli.version=$VERSION" ./cmd/asana-cli
          done

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Build documentation
        env:
          ASTRO_TELEMETRY_DISABLED: "1"
        run: make docs-build

      - name: Install pinned GoReleaser
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/goreleaser.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/goreleaser/goreleaser/releases/download/${GORELEASER_VERSION}/goreleaser_Linux_x86_64.tar.gz" \
            --output "$archive"
          echo "$GORELEASER_SHA256  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" goreleaser
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/goreleaser" --version

      - name: Validate GoReleaser configuration
        run: goreleaser check

      - name: Install pinned Syft
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/syft.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/anchore/syft/releases/download/${SYFT_VERSION}/syft_${SYFT_VERSION#v}_linux_amd64.tar.gz" \
            --output "$archive"
          echo "$SYFT_SHA256  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" syft
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          syft version

      - name: Re-run clean release snapshot contract
        run: |
          goreleaser release --snapshot --clean
          python3 .github/scripts/generate-release-sboms.py dist --tool-version "${SYFT_VERSION#v}"
          python3 .github/scripts/generate-homebrew-formula.py dist
          python3 .github/scripts/verify-release-snapshot.py dist

      - name: Publish preflight summary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## Release preflight

          - **Tag:** `${{ steps.metadata.outputs.tag }}`
          - **Version:** `${{ steps.metadata.outputs.version }}`
          - **Class:** ${{ steps.metadata.outputs.prerelease == 'true' && 'prerelease' || 'stable' }}
          - **Commit:** `${{ steps.metadata.outputs.commit }}`
          - **Result:** quality, docs, snapshot, and ancestry checks passed
          EOF

      - name: Verify preflight did not mutate the checkout
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"

  release-build:
    name: release-build
    needs: release-preflight
    if: github.event_name == 'push' || inputs.stage == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout validated commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.release-preflight.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go from go.mod
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install pinned GoReleaser
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/goreleaser.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/goreleaser/goreleaser/releases/download/${GORELEASER_VERSION}/goreleaser_Linux_x86_64.tar.gz" \
            --output "$archive"
          echo "$GORELEASER_SHA256  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" goreleaser
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Install pinned Syft
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/syft.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/anchore/syft/releases/download/${SYFT_VERSION}/syft_${SYFT_VERSION#v}_linux_amd64.tar.gz" \
            --output "$archive"
          echo "$SYFT_SHA256  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" syft
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          syft version

      - name: Build final artifacts once
        run: |
          set -euo pipefail
          goreleaser release --clean --skip=publish
          python3 .github/scripts/generate-release-sboms.py dist --tool-version "${SYFT_VERSION#v}"
          python3 .github/scripts/build-release-manifest.py dist \
            --tag "${{ needs.release-preflight.outputs.tag }}" \
            --commit "${{ needs.release-preflight.outputs.commit }}" \
            --source-repository "${GITHUB_REPOSITORY}" \
            --go-version "$(go env GOVERSION)" \
            --goreleaser-version "$GORELEASER_VERSION"
          python3 .github/scripts/generate-homebrew-formula.py dist
          python3 .github/scripts/verify-release.py dist \
            --expected-version "${{ needs.release-preflight.outputs.version }}" \
            --repository "${GITHUB_REPOSITORY}"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Publish artifact manifest summary
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('dist/release-manifest.json').read_text())
          with Path(__import__('os').environ['GITHUB_STEP_SUMMARY']).open('a') as summary:
              summary.write('## Release build\\n\\n')
              summary.write(f"- **Tag:** `{manifest['tag']}`\\n- **Commit:** `{manifest['commit']}`\\n")
              for artifact in manifest['artifacts']:
                  summary.write(f"- `{artifact['name']}` — `{artifact['sha256']}`\\n")
          PY

      - name: Upload immutable release build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-build
          path: dist/
          if-no-files-found: error
          retention-days: 30

  attest-release:
    name: attest-release
    needs: [release-preflight, release-build]
    if: github.event_name == 'push' || inputs.stage == 'full'
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download exact build output
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-build
          path: dist
      - name: Verify subjects before attestation
        run: python3 .github/scripts/verify-release.py dist --expected-version "${{ needs.release-preflight.outputs.version }}" --repository "${GITHUB_REPOSITORY}"
      - name: Attest exact release subjects
        uses: actions/attest-build-provenance@c074443f1aee8d4aeeae555aebba3282517141b2 # v2.2.3
        with:
          subject-path: |
            dist/asana-cli_*.tar.gz
            dist/checksums.txt
            dist/release-manifest.json
            dist/*.sbom.spdx.json
      - name: Summarize attested subjects
        run: |
          {
            echo "## Release provenance"
            echo
            echo "Attested exact bytes that the publish stage uploads:"
            find dist -maxdepth 1 -type f \( -name 'asana-cli_*.tar.gz' -o -name 'checksums.txt' -o -name 'release-manifest.json' -o -name '*.sbom.spdx.json' \) -print | sort
          } >> "$GITHUB_STEP_SUMMARY"

  publish-github-release:
    name: publish-github-release
    needs: [release-preflight, release-build, attest-release]
    if: >-
      always() && needs.release-preflight.result == 'success' &&
      (github.event_name == 'push' || inputs.stage == 'full' || inputs.stage == 'publish') &&
      (inputs.stage != 'full' || needs.release-build.result == 'success') &&
      (inputs.stage != 'full' || needs.attest-release.result == 'success')
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download exact build output
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-build
          path: dist
          run-id: ${{ inputs.build_run_id || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify build manifest and checksums
        run: python3 .github/scripts/verify-release.py dist --expected-version "${{ needs.release-preflight.outputs.version }}"

      - name: Create or resume GitHub Release without digest conflicts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/publish-github-release.py dist "${{ needs.release-preflight.outputs.tag }}"

  promote-homebrew:
    name: promote-homebrew
    needs: [release-preflight, publish-github-release]
    if: >-
      always() && needs.release-preflight.result == 'success' &&
      (github.event_name == 'push' || inputs.stage == 'full' || inputs.stage == 'promote') &&
      (inputs.stage != 'full' || needs.publish-github-release.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - name: Download exact build output
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-build
          path: dist
          run-id: ${{ inputs.build_run_id || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate formula from published artifact bytes
        run: |
          python3 .github/scripts/verify-release.py dist --expected-version "${{ needs.release-preflight.outputs.version }}"
          python3 .github/scripts/generate-homebrew-formula.py dist

      - name: Promote formula with tap-only credential
        env:
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: python3 .github/scripts/promote-homebrew.py dist/homebrew/Formula/asana-cli.rb "${{ needs.release-preflight.outputs.version }}"

  release-verify:
    name: release-verify
    needs: [release-preflight, publish-github-release]
    if: >-
      always() && needs.release-preflight.result == 'success' &&
      (needs.publish-github-release.result == 'success' || inputs.stage == 'promote' || inputs.stage == 'verify') &&
      (github.event_name == 'push' || inputs.stage == 'full' || inputs.stage == 'publish' || inputs.stage == 'promote' || inputs.stage == 'verify')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Verify public release assets, checksums, SBOMs, and provenance
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/verify-public-release.py "${{ needs.release-preflight.outputs.tag }}"

  homebrew-verify:
    name: homebrew-verify
    needs: [release-preflight, promote-homebrew, release-verify]
    if: >-
      always() && needs.release-preflight.result == 'success' &&
      (needs.promote-homebrew.result == 'success' || inputs.stage == 'verify') &&
      needs.release-verify.result == 'success'
    runs-on: macos-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout public tap formula
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: thaodangspace/homebrew-tap
          path: tap
          persist-credentials: false

      - name: Audit formula
        run: brew audit --formula --online tap/Formula/asana-cli.rb

      - name: Install stable release and verify version
        if: needs.release-preflight.outputs.prerelease == 'false'
        run: |
          brew install --formula tap/Formula/asana-cli.rb
          asana-cli --version | grep -F "${{ needs.release-preflight.outputs.version }}"
          brew test asana-cli
