version: 2
updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: UTC
    open-pull-requests-limit: 8
    labels: [dependencies, go]
    groups:
      go-patch-minor:
        update-types: [patch, minor]

  - package-ecosystem: npm
    directory: "/docs"
    schedule:
      interval: weekly
      day: monday
      time: "06:15"
      timezone: UTC
    open-pull-requests-limit: 8
    labels: [dependencies, docs]
    versioning-strategy: increase
    groups:
      docs-patch-minor:
        update-types: [patch, minor]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: UTC
    open-pull-requests-limit: 8
    labels: [dependencies, github-actions]
    groups:
      actions-patch-minor:
        update-types: [patch, minor]
